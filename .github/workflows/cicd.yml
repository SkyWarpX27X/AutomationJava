name: Lab 6 CI/CD pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

defaults:
  run:
    working-directory: Lab6Ostapchuk

jobs:
  analyze-test-upload:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Analyze code
      run: ./gradlew checkstyleMain
      
    - name: Test
      run: ./gradlew test

    - name: Build jar
      run: ./gradlew jar

    - name: Upload jar to repository
      uses: actions/upload-artifact@v7.0.1
      with:
        path: Lab6Ostapchuk/
